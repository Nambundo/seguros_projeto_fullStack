spring.application.name=insurancehub

# --- Banco de dados (sobrescreva com variáveis de ambiente) ---
spring.datasource.url=${DB_URL:jdbc:sqlserver://localhost:1433;databaseName=InsuranceHub;encrypt=true;trustServerCertificate=true}
spring.datasource.username=${DB_USER:sa}
spring.datasource.password=${DB_PASSWORD:YourStrong!Passw0rd}

# --- JPA / Hibernate ---
# "update" cria/ajusta tabelas sozinho: ótimo para estudo. Em produção use Flyway/Liquibase.
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.show-sql=${SHOW_SQL:false}
spring.jpa.properties.hibernate.format_sql=true

# --- Servidor ---
server.port=8080

# --- CORS: origens do frontend permitidas (separadas por vírgula) ---
app.cors.allowed-origins=${CORS_ORIGINS:http://localhost:5173,http://127.0.0.1:5173}
